<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;display:flex;gap:10px}.s{flex:1;height:90px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:10px}</style></head><body>
<div class="s" style="background:var(--accent);color:var(--accent-ink)">--accent<br>#FFB43D</div>
<div class="s" style="background:var(--accent-hover);color:var(--accent-ink)">--accent-hover</div>
<div class="s" style="background:var(--accent-press);color:var(--accent-ink)">--accent-press</div>
<div class="s" style="background:var(--bg-2);color:var(--fg-1);border:1px solid var(--line-1)">--fg-1 body</div>
<div class="s" style="background:var(--bg-2);color:var(--fg-2);border:1px solid var(--line-1)">--fg-2 muted</div>
<div class="s" style="background:var(--bg-2);color:var(--fg-3);border:1px solid var(--line-1)">--fg-3 faint</div>
</body></html>
