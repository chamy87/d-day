<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;display:flex;gap:10px}.s{flex:1;height:90px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:10px;color:#0B0E11}.d{color:var(--fg-1);border:1px solid var(--line-1)}</style></head><body>
<div class="s" style="background:var(--value)">--value<br>#3DDC97</div>
<div class="s d" style="background:var(--value-dim)">--value-dim</div>
<div class="s" style="background:var(--reach)">--reach<br>#FF5C5C</div>
<div class="s d" style="background:var(--reach-dim)">--reach-dim</div>
<div class="s" style="background:var(--warn)">--warn<br>#FFD23D</div>
</body></html>
