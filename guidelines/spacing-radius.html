<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;display:flex;gap:14px;align-items:center}.c{background:var(--bg-2);border:1px solid var(--line-1);width:100px;height:88px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:9px;color:var(--fg-3)}</style></head><body>
<div class="c" style="border-radius:var(--radius-sm)">sm 6</div>
<div class="c" style="border-radius:var(--radius-md)">md 10</div>
<div class="c" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-card)">lg 14 + card</div>
<div class="c" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);background:var(--bg-3)">pop</div>
<div class="c" style="border-radius:var(--radius-lg);box-shadow:var(--glow-accent)">glow</div>
<div style="background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:6px 16px;font-family:var(--font-mono);font-size:9px;color:var(--fg-2)">pill</div>
</body></html>
