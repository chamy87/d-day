# Hourly news + injury ingestion. Vercel's plan limits crons to daily, so the
# hourly cadence runs here; the Vercel daily cron remains as a backstop.
# Game windows (Sun afternoon, Thu/Mon night, UTC) run every 15 min so
# inactives — posted 90 min before kickoff — reach start/sit quickly.
name: news-cron
on:
  schedule:
    - cron: "15 * * * *"
    - cron: "*/15 15-23 * * 0"
    - cron: "*/15 22-23 * * 1,4"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh news, injuries, stats
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fantasydday.com/api/cron/frequent"
